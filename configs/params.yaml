# Parámetros del proyecto. Las rutas son relativas a la raíz del repositorio.

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  models_dir: models
  data_card: docs/data-card.md

data:
  kaggle_competition: sa-customer-segmentation
  # La competición separa a los socios en train/test (sin solape). Para segmentar se usa la
  # población completa: raw_filename es la concatenación de source_files.
  source_files: [flight_train.csv, flight_test.csv]
  raw_filename: flight.csv
  max_raw_size_mb: 20
  clean_filename: flight_clean.parquet
  lineage_filename: cleaning_lineage.json
  lrfmc_filename: lrfmc.parquet
  profile_filename: profile.parquet
  scaled_filename: lrfmc_scaled.parquet
  transform_comparison_filename: transform_comparison.csv
  preprocessor_filename: preprocessor.joblib
  k_selection_filename: k_selection.csv
  silhouette_curves_filename: silhouette_curves.parquet
  k_preview_filename: k_preview.csv
  segments_filename: segments.parquet
  metrics_filename: metrics.json
  stability_filename: stability.csv
  benchmark_filename: benchmark.csv
  k_distance_filename: k_distance.csv
  kmeans_filename: kmeans.joblib
  gmm_filename: gmm.joblib
  pca_variance_filename: pca_variance.csv
  pca_loadings_filename: pca_loadings.csv
  pca_projection_filename: pca_projection.parquet
  tsne_filename: tsne.parquet
  projection_metrics_filename: projection.json
  segment_profiles_filename: segment_profiles.csv
  archetype_scores_filename: archetype_scores.csv
  segment_tests_filename: segment_tests.csv
  naming_robustness_filename: naming_robustness.json

cleaning:
  date_format: "%m/%d/%Y"
  age_min: 18
  age_max: 100
  # Valores de texto que significan "sin dato" (tras strip) en columnas de ubicación/género.
  text_placeholders: [".", "-", "。", "0", "`", "——", "nan"]

preprocessing:
  # Elección de la Fase 5 (ver 03-lrfmc.qmd): Yeo-Johnson deja |skew| < 0,1 en las cinco
  # features y StandardScaler les da el mismo peso en la distancia de K-Means.
  transform: yeo-johnson
  scaler: standard
  # Comparación de alternativas: silhouette de K-Means con estos k fijos, sobre una muestra.
  compare_ks: [4, 5, 6]
  silhouette_sample_size: 10000

k_selection:
  k_min: 2
  k_max: 10
  # El silhouette es O(n²): se calcula sobre una muestra estratificada por clúster.
  silhouette_sample_size: 10000
  # k para los que se guarda el silhouette plot (el sitio permite compararlos).
  silhouette_plot_ks: [3, 4, 5, 6, 7]
  # Elección de la Fase 6 (ver 04-clustering.qmd): codo + máximo local de silhouette +
  # mínimo local de Davies-Bouldin, y segmentos interpretables.
  chosen_k: 5

modeling:
  # Estabilidad: ARI entre los modelos entrenados con cada par de semillas (10 → 45 pares) y
  # entre el modelo completo y modelos entrenados con submuestras del 80 % de los socios.
  stability_seeds: 10
  subsample_runs: 10
  subsample_fraction: 0.8
  # Benchmark. GMM: covarianza elegida por BIC. Ward es O(n²) en memoria → muestra.
  # DBSCAN: min_samples = 2 · nº de features; eps = codo del gráfico k-distance.
  gmm_covariance_types: [full, diag]
  gmm_n_init: 3
  agglomerative_sample_size: 10000
  dbscan_min_samples: 10
  silhouette_sample_size: 10000

projection:
  # Solo para visualizar (no se clusteriza sobre las proyecciones). PCA se ajusta con todos los
  # socios; los gráficos usan muestras estratificadas por clúster para no inflar el HTML.
  pca_sample_size: 4000
  tsne_sample_size: 8000
  tsne_perplexities: [30, 50]
  # Trustworthiness (vecinos conservados) es O(n²): submuestra de la muestra de t-SNE.
  trust_sample_size: 2000
  trust_neighbors: 10

quality:
  # Criterio principal: estabilidad. K-Means con distintas semillas debe dar los mismos
  # segmentos (ARI medio entre ejecuciones).
  min_stability_ari: 0.90
  # Criterio secundario: con clientes reales el comportamiento es un continuo y el silhouette
  # rara vez supera 0,25; se exige al menos 0,20 (k = 5 obtiene 0,21).
  min_silhouette: 0.20
  min_segment_pct: 0.03

random_state: 42
